name: Event demo credit and guest isolation
on:
  pull_request:
    paths:
      - "src/coordinator/event-demo*.ts"
      - "src/coordinator/browser-compute-init.ts"
      - "src/core/event-demo-config.ts"
      - "src/economy/event-demo-schema.ts"
      - "src/economy/managed-event-budget.ts"
      - "src/economy/managed-purchases.ts"
      - "src/agent/apps/web/src/pages/demo/**"
      - "scripts/qualify-event-demo-browser.mts"
      - "tests/event-demo*.ts"
      - ".github/workflows/event-demo-qualification.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    name: Guest admission and real credit settlement on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ephemeral_demo_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the actual coordinator and its reference worker
        run: npm exec -- tsc -p tsconfig.build.json
      - name: Exercise actual guest grants, holds, expiry, receipts and cookie isolation
        env:
          MYCELLIOS_REFERRAL_TEST_POSTGRES_URL: postgres://postgres:ephemeral_demo_fixture@127.0.0.1:5432/postgres
        run: node scripts/test-referrals-postgres.mjs tests/event-demo.postgres.test.ts tests/browser-inference.postgres.test.ts
      - name: Install the existing browser workspace
        run: npm ci --prefix src/agent --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate --prefix src/agent
      - name: Install the real browser
        working-directory: src/agent
        run: npm exec -- playwright install --with-deps chromium
      - name: Prepare hash-pinned public pretrained weights without paid inference
        run: node --import tsx scripts/prepare-browser-text-model.mts
      - name: Verify two signed browsers, complete-model inference, credit settlement and pause
        env:
          MYCELLIOS_REFERRAL_TEST_POSTGRES_URL: postgres://postgres:ephemeral_demo_fixture@127.0.0.1:5432/postgres
        run: node --import tsx scripts/qualify-event-demo-browser.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: event-demo-model-proof-${{ github.sha }}
          path: event-demo-model-proof
          if-no-files-found: warn
          retention-days: 7
