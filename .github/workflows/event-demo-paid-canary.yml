name: Explicit event demo paid canary
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: choice
        options: ["NO", "ONE_GUEST_UP_TO_0_20"]
        default: "NO"
        required: true
      deadline:
        description: "Authorized start deadline, UTC epoch milliseconds (within 15 minutes)"
        required: true
      statePublicKey:
        description: "Base64 RSA public recovery key; never provide a private key"
        required: true
      resumeGuest:
        description: "Resume the same preserved Guest 04; never grant another test wallet"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: event-demo-paid-canary
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.confirmation == 'ONE_GUEST_UP_TO_0_20' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: src/agent/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - name: One real QR guest, three replies, at most the original 0.20 Credit wallet
        env:
          MYCELLIOS_DEMO_PAID_CONFIRM: ${{ inputs.confirmation }}
          MYCELLIOS_DEMO_PAID_DEADLINE: ${{ inputs.deadline }}
          MYCELLIOS_DEMO_STATE_PUBLIC_KEY: ${{ inputs.statePublicKey }}
          MYCELLIOS_DEMO_BROWSER_STATE: ${{ inputs.resumeGuest && secrets.EVENT_DEMO_CANARY_GUEST_STATE || '' }}
          MYCELLIOS_DEMO_RESUME: ${{ inputs.resumeGuest }}
        run: node scripts/verify-event-demo-paid.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: event-demo-paid-proof-${{ github.run_id }}
          path: src/agent/event-paid-proof
          if-no-files-found: warn
          retention-days: 3
