name: Proportional remote validation

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    # Most candidates finish well within 25 minutes; a change to the Agent image's inputs also
    # builds and boots that image here.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/agent/package-lock.json
      # Native Python surfaces install hash-locked cp312 wheels; the runner
      # image's own python3 follows the Ubuntu release instead.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate changed surfaces remotely
        run: node scripts/ci-proportional.mjs
      - name: Preserve exact-revision validation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proportional-validation-${{ github.sha }}
          path: .ci/proportional-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve mobile conversation screenshots
        if: always() && hashFiles('.ci/mobile-conversation-menu/*.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-conversation-menu-${{ github.sha }}
          path: .ci/mobile-conversation-menu/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the Desktop downloads page build
        if: success() && hashFiles('build/desktop-downloads/web/desktop-downloads.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-downloads-page-${{ github.sha }}
          path: build/desktop-downloads/web
          if-no-files-found: error
          retention-days: 14
