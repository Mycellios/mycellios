name: Deployment readiness (temporary fast mode)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record owner-selected fast readiness
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid source SHA'; exit 1; }
          [ "$RELEASE_BRANCH" = "$DEFAULT_BRANCH" ] || { echo 'Readiness requires the actual default branch'; exit 1; }
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo 'Unsupported readiness event'; exit 1 ;;
          esac
          message='Temporary fast mode: full tests, security scans and cross-platform CI packaging were NOT RUN. This job records source readiness only; it does not certify or perform a deployment. The requested release still needs its real build, artifact identity and health verification.'
          printf '%s\nSource: %s\n' "$message" "$RELEASE_SHA"
          printf '## Temporary fast readiness\n\n%s\n\nSource: `%s`.\n' "$message" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
