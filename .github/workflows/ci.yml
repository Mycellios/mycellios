name: Proportional remote validation

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/agent/package-lock.json
      - name: Validate changed surfaces remotely
        run: node scripts/ci-proportional.mjs
      - name: Preserve exact-revision validation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proportional-validation-${{ github.sha }}
          path: .ci/proportional-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the Desktop downloads page build
        if: success() && hashFiles('build/desktop-downloads/web/desktop-downloads.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-downloads-page-${{ github.sha }}
          path: build/desktop-downloads/web
          if-no-files-found: error
          retention-days: 14

  # Asks Nucleus to deploy this exact main revision after CI passes. Nucleus verifies the
  # GitHub OIDC token and the CI result itself, then builds, promotes, health-checks and rolls
  # back. Off until the NUCLEUS_DEPLOY_URL repository variable is set.
  request-deployment:
    name: Request Nucleus deployment
    needs: summary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NUCLEUS_DEPLOY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Request the deployment of this revision
        env:
          NUCLEUS_DEPLOY_URL: ${{ vars.NUCLEUS_DEPLOY_URL }}
          AUDIENCE: ${{ vars.NUCLEUS_DEPLOY_AUDIENCE || 'nucleus-deployments' }}
        run: |
          set -euo pipefail
          case "$NUCLEUS_DEPLOY_URL" in https://*) ;; *) echo "NUCLEUS_DEPLOY_URL must use HTTPS" >&2; exit 1 ;; esac
          token="$(curl -fsS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')"
          echo "::add-mask::$token"
          status="$(curl -sS --max-time 60 -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" "${NUCLEUS_DEPLOY_URL%/}/api/v1/deployments/github")"
          cat response.json; echo
          case "$status" in 200|202) ;; *) echo "Nucleus refused the deployment request ($status)" >&2; exit 1 ;; esac
