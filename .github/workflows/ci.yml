name: Proportional remote validation

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/agent/package-lock.json
      - name: Validate changed surfaces remotely
        run: node scripts/ci-proportional.mjs
      - name: Preserve exact-revision validation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proportional-validation-${{ github.sha }}
          path: .ci/proportional-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the Desktop downloads page build
        if: success() && hashFiles('build/desktop-downloads/web/desktop-downloads.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-downloads-page-${{ github.sha }}
          path: build/desktop-downloads/web
          if-no-files-found: error
          retention-days: 14
  macos-signature-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Verify the immutable published Intel DMG without installation or launch
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 300 https://www.mycellios.com/downloads/desktop/releases/0.3.50/Mycellios-Desktop-0.3.50-macos-x64-preview.dmg -o "$RUNNER_TEMP/published-intel.dmg"
          node scripts/desktop-macos/diagnose-public-signature.mjs "$RUNNER_TEMP/published-intel.dmg"
