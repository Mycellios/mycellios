name: Deployment CI contract

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read

jobs:
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the existing quality gates for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: python
        run: |
          import json, os, time, urllib.request

          required = {
              "Static repository policy", "TypeScript, tests and build",
              "Python 3.12 runtime", "Native product boundary",
              "GitHub Actions syntax", "Dependency audit", "Gitleaks",
              "CodeQL (python)", "CodeQL (javascript-typescript)",
              "mycellios-node · linux-x64", "mycellios-node · macos-arm64",
              "mycellios-node · windows-x64",
          }
          url = ("https://api.github.com/repos/" + os.environ["REPOSITORY"]
                 + "/commits/" + os.environ["RELEASE_SHA"]
                 + "/check-runs?filter=latest&per_page=100")
          for attempt in range(165):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              if data["total_count"] > 100:
                  raise SystemExit("Unexpected check count; review CI contract")
              checks = {c["name"]: c for c in data["check_runs"]
                        if c["app"]["id"] == 15368
                        and c["head_sha"] == os.environ["RELEASE_SHA"]}
              failed = [name for name in required if name in checks
                        and checks[name]["status"] == "completed"
                        and checks[name]["conclusion"] != "success"]
              if failed:
                  raise SystemExit("Required gates failed: " + ", ".join(sorted(failed)))
              missing = [name for name in required if name not in checks
                         or checks[name]["conclusion"] != "success"]
              if not missing:
                  print("All 12 existing required gates passed for " + os.environ["RELEASE_SHA"])
                  break
              print("Waiting for: " + ", ".join(sorted(missing)), flush=True)
              time.sleep(15)
          else:
              raise SystemExit("Required gates did not finish; deployment stays blocked")
