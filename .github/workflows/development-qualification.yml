name: Isolated development qualification
on:
  pull_request:
    paths:
      - 'src/agent/scripts/desktop-dev*'
      - 'src/agent/scripts/project-local*'
      - 'src/agent/scripts/verify-desktop-dev.mjs'
      - 'src/agent/apps/desktop/src/development-launcher*'
      - '.github/workflows/development-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    name: Dev runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/agent/package-lock.json
      - name: Install the two locked dependency graphs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/agent --ignore-scripts --no-audit --no-fund
      - name: Qualify isolated account, services, HMR and shutdown
        if: runner.os == 'Linux'
        working-directory: src/agent
        run: npm run dev:desktop:verify
      - name: Qualify the real separate Desktop window
        if: runner.os == 'Windows'
        working-directory: src/agent
        run: npm run dev:desktop:verify -- --window
