name: Agent workspace acceptance

on:
  pull_request:
    paths:
      - "src/agent/**"
      - ".github/workflows/agent-workspace-acceptance.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-workspace-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-boundary:
    name: Windows voice and process ownership
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/agent/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- vitest run apps/desktop/src/local-voice.test.ts apps/desktop/src/preload.test.ts apps/desktop/src/manual-update.test.ts apps/desktop/src/manual-update-helper.test.ts apps/desktop/src/manual-update-lock.test.ts packages/adapters/src/desktop-process-tree.test.ts --maxWorkers=2
      - name: Exercise real isolated floating chat windows
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if($LASTEXITCODE){exit $LASTEXITCODE}
          npm run db:generate
          if($LASTEXITCODE){exit $LASTEXITCODE}
          npm run build --workspace @rakazo/desktop
          if($LASTEXITCODE){exit $LASTEXITCODE}
          node apps/desktop/scripts/verify-floating-chats.mjs floating-chat-proof
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: floating-chat-proof-${{ github.sha }}
          path: src/agent/floating-chat-proof
          if-no-files-found: warn
          retention-days: 7
  workspace:
    name: Agent workspace persistence and browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/agent/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
      - name: Check owned source boundaries
        working-directory: .
        run: |
          node scripts/verify-repository-structure.mjs
          node src/agent/node_modules/tsx/dist/cli.mjs scripts/verify-architecture.ts
          node src/agent/node_modules/tsx/dist/cli.mjs scripts/verify-component-boundaries.ts
      - name: Exercise isolated PostgreSQL ownership and migration
        run: npm exec -- tsx scripts/verify-workspace-sync-db.ts
      - name: Install browser
        run: npm exec -- playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      - name: Exercise real workspace controls with synthetic RPC fixtures
        run: node scripts/verify-workspace-sync-ui.mjs --output=workspace-proof
      - name: Exercise conversation delivery, progress and reduced motion
        run: node scripts/verify-chat-fluidity.mjs --output=chat-flow-proof
      - name: Exercise compact velvet bodies, eye pads and all-color rendering
        run: node scripts/verify-compact-micos.mjs --output=compact-micos-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-workspace-proof-${{ github.sha }}
          path: |
            src/agent/workspace-proof
            src/agent/chat-flow-proof
            src/agent/compact-micos-proof
          if-no-files-found: warn
          retention-days: 7
