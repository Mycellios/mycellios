name: Qualify exact published Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Install pinned qualification dependencies
        working-directory: src/agent
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: desktop-windows-68779b4b032c187a304e328865878fa5111bb511
          run-id: 43035588681
          github-token: ${{ github.token }}
          path: qualified
      - name: Bind exact published bytes and qualify native installation
        working-directory: src/agent
        shell: pwsh
        run: |
          $output=Join-Path $env:GITHUB_WORKSPACE 'qualified'
          $identity=Get-Content (Join-Path $output 'desktop-build.json') -Raw | ConvertFrom-Json
          if($identity.version -ne '0.3.43' -or $identity.revision -ne '68779b4b032c187a304e328865878fa5111bb511'){throw 'Wrong candidate'}
          $installer=Join-Path $output 'Mycellios-Desktop-0.3.43-windows-x64-pilot.exe'
          if((Get-FileHash $installer).Hash.ToLowerInvariant() -ne 'f2efcd79996a01ffa0ee5c4b61901c9e61d2141c4539c1fa00ac123346601f8d'){throw 'Published installer differs'}
          node apps/desktop/scripts/qualify-windows-install.mjs $output
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: exact-043-installation-qualification
          path: qualified/installer-qualification.json
          if-no-files-found: error
