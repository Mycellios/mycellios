name: Agent release artifact

on:
  push:
    branches: ["release/**"]
    paths:
      - "src/**"
      - "landing/**"
      - "package*.json"
      - "scripts/**"
      - ".github/workflows/agent-release-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and seal server release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/agent/package-lock.json
      - name: Install locked build inputs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/agent --ignore-scripts --no-audit --no-fund
      - name: Compile coordinator and its browser surfaces
        run: npm run build
      - name: Seal the complete native runtime with its production dependencies
        run: npm run coordinator:release:prepare -- --revision="$GITHUB_SHA"
      - name: Compile Agent without production credentials
        working-directory: src/agent
        run: |
          npm run db:generate
          npm run build --workspace @rakazo/api --workspace @rakazo/worker
          node scripts/verify-server-startup.mjs
          APP_BASE_PATH=/agent/ npm run build --workspace @rakazo/web
      - name: Seal immutable outputs and migration inputs
        run: |
          mkdir -p release-artifact
          tar -czf release-artifact/native.tar.gz -C build/coordinator-release .
          node scripts/verify-coordinator-release.mjs --archive=release-artifact/native.tar.gz
          tar -czf release-artifact/payload.tar.gz dist package.json package-lock.json \
            src/agent/apps/api/dist src/agent/apps/worker/dist src/agent/apps/web/dist \
            src/agent/packages/db/prisma src/agent/package.json src/agent/package-lock.json
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const hash = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const manifest = {
            schemaVersion: 2,
            revision: git('rev-parse', 'HEAD'),
            tree: git('rev-parse', 'HEAD^{tree}'),
            runId: process.env.GITHUB_RUN_ID,
            node: process.version,
            archiveSha256: hash('release-artifact/payload.tar.gz'),
            nativeArchiveSha256: hash('release-artifact/native.tar.gz'),
            nativeSourceId: JSON.parse(readFileSync('build/coordinator-release/mycellios-coordinator-release-manifest.json', 'utf8')).sourceId,
            rootLockSha256: hash('package-lock.json'),
            agentLockSha256: hash('src/agent/package-lock.json'),
            apiSha256: hash('src/agent/apps/api/dist/index.js'),
            workerSha256: hash('src/agent/apps/worker/dist/index.js'),
            coordinatorSha256: hash('dist/coordinator/main.js'),
            webBuild: readFileSync('src/agent/apps/web/dist/build-id', 'utf8').trim(),
            startup: 'compiled imports and missing-database guard only',
            deployed: false,
            migrationsApplied: false,
            paidInference: false,
            agentDependenciesIncluded: false,
            nativeDependenciesIncluded: true,
          };
          writeFileSync('release-artifact/candidate.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(manifest, null, 2));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-server-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
