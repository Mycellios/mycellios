name: Isolated Mico computers

on:
  pull_request:
    paths:
      - ".github/workflows/agent-isolated-computers.yml"
      - "src/agent/packages/db/src/computers.ts"
      - "src/agent/packages/db/src/repos.ts"
      - "src/agent/packages/db/prisma/migrations/20261116070000_isolated_computers/**"
      - "src/agent/packages/adapters/src/computer-lifecycle.ts"
      - "src/agent/packages/adapters/src/computer-support.ts"
      - "src/agent/packages/adapters/src/host-aware-sandbox.ts"
      - "src/agent/packages/adapters/src/executor.ts"
      - "src/agent/packages/testkit/src/isolated-computers.docker.test.ts"
      - "src/agent/packages/testkit/src/cli/computer-replay.ts"
      - "src/agent/infra/sandboxes/computer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-computers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  computers:
    name: Two isolated Docker computers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/agent/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
      - name: Build the existing computer image on this disposable runner
        run: docker build --build-arg TARGETARCH=amd64 -t rakazo/computer:local infra/sandboxes/computer
      - name: Verify two real desktops with no model or provider credentials
        run: node --import tsx packages/testkit/src/cli/computer-replay.ts --isolated --output=isolated-docker-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-docker-proof-${{ github.sha }}
          path: src/agent/isolated-docker-proof
          if-no-files-found: warn
          retention-days: 7
