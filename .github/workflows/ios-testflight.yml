name: iOS TestFlight

# Builds the existing Expo iOS app and uploads it to TestFlight. It does not submit
# the app for App Store review. Apple credentials stay in repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build iOS and upload it to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require TestFlight secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          for name in EXPO_TOKEN ASC_APP_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Add these repository secrets (see src/agent/docs/mobile-release.md): ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/agent/package-lock.json

      - name: Install dependencies
        working-directory: src/agent
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli@27.10.0

      - name: Require the Mycellios Expo project
        working-directory: src/agent/apps/mobile
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const app = JSON.parse(readFileSync("app.json", "utf8"));
            const id = app.expo?.extra?.eas?.projectId;
            if (typeof id !== "string" || !/^[0-9a-f-]{36}$/i.test(id)) {
              console.error("Link apps/mobile to the Mycellios Expo account with eas project:init and commit extra.eas.projectId. Do not reuse another product Expo project.");
              process.exit(1);
            }
          '

      - name: Require the production API origin
        working-directory: src/agent/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          vars="$(eas env:list production --non-interactive --format short)"
          if ! grep -q '^EXPO_PUBLIC_API_URL=' <<< "$vars"; then
            echo "Set EXPO_PUBLIC_API_URL in the EAS production environment. See src/agent/docs/mobile-release.md." >&2
            exit 1
          fi

      - name: Build the iOS app
        id: build
        working-directory: src/agent/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform ios --profile testflight --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const raw = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/build.json`, "utf8"));
            const build = Array.isArray(raw) ? raw[0] : raw;
            if (!build || build.status !== "FINISHED" || typeof build.id !== "string" || !build.id) {
              console.error("EAS did not finish an iOS build.");
              process.exit(1);
            }
            process.stdout.write(build.id);
          ')"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        working-directory: src/agent/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          jq \
            --arg id "$ASC_APP_ID" \
            --arg key "$key" \
            --arg kid "$ASC_KEY_ID" \
            --arg issuer "$ASC_ISSUER_ID" \
            '.submit.testflight.ios = {ascAppId:$id, ascApiKeyPath:$key, ascApiKeyId:$kid, ascApiKeyIssuerId:$issuer}' \
            eas.json > "$RUNNER_TEMP/eas.json"
          cp "$RUNNER_TEMP/eas.json" eas.json
          eas submit --platform ios --profile testflight --id "$BUILD_ID" --non-interactive --wait
          rm -f "$key" eas.json
          git checkout -- eas.json
