name: Windows publisher qualification
on:
  pull_request:
    paths:
      - 'src/agent/apps/desktop/scripts/**'
      - 'src/agent/apps/desktop/src/published-desktop-release*'
      - '.github/workflows/desktop-windows*.yml'
      - '.github/workflows/windows-publisher-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise signing configuration and immutable release contracts
        run: node --test apps/desktop/scripts/windows-signing.test.mjs apps/desktop/scripts/desktop-release.test.mjs apps/desktop/scripts/windows-installer.test.mjs
      - name: Exercise signed and unsigned manual update discovery
        run: npm exec -- vitest run apps/desktop/src/published-desktop-release.test.ts
      - name: Exercise actual Windows trust verification without a signing key
        shell: pwsh
        run: ./apps/desktop/scripts/verify-windows-signature-fixture.ps1
