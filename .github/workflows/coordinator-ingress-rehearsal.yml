name: Coordinator ingress rehearsal

on:
  pull_request:
    paths:
      - 'deploy/coordinator-ingress/**'
      - '.github/workflows/coordinator-ingress-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Exercise the stable route and rollback with Docker and Nginx
        run: node deploy/coordinator-ingress/rehearse.mjs
