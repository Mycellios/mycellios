name: Mycellios Desktop macOS
on:
  workflow_dispatch:
    inputs:
      revision:
        type: string
        default: ""
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-macos-${{ inputs.revision || github.sha }}
  cancel-in-progress: false
  queue: max
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            machine: arm64
            app_dir: mac-arm64
          - arch: x64
            runner: macos-26-intel
            machine: x86_64
            app_dir: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      RAKAZO_PROJECT_LOCAL: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Retrieve only the pinned contribution runtime
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          mkdir -p "$RUNNER_TEMP/desktop-release/evidence"
          if [ '${{ matrix.arch }}' = arm64 ]; then
            curl -fL --retry 2 https://www.mycellios.com/downloads/macos-arm64 -o "$RUNNER_TEMP/runtime.pkg"
            echo "66d48aaee92bd50233d37c901fbcfee92228d9cdeb0981bf2483ca68cc28f608  $RUNNER_TEMP/runtime.pkg" | shasum -a 256 -c
          fi
      - name: Build current source and qualify its packaged local server
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/macos-packaged-resources.test.mjs
          cd src/agent
          npm ci --ignore-scripts --no-audit --no-fund
          npm run db:generate
          node --test apps/desktop/scripts/macos-installer.test.mjs apps/desktop/scripts/macos-sign-walk.test.mjs apps/desktop/scripts/standalone-installer-config.test.mjs apps/desktop/scripts/node-runtime-license.test.mjs apps/desktop/scripts/compact-resources.test.mjs apps/desktop/scripts/release-continuity.test.mjs
          npm run build --workspace @rakazo/web -- --desktop
          npm run build --workspace @rakazo/desktop
          npm run build:local-server --workspace @rakazo/desktop
          node node_modules/electron/install.js
          if [ '${{ matrix.arch }}' = arm64 ]; then
            npm exec --workspace @rakazo/desktop -- node scripts/package-macos.mjs --arch arm64 --runtime "$RUNNER_TEMP/runtime.pkg" --sha256 66d48aaee92bd50233d37c901fbcfee92228d9cdeb0981bf2483ca68cc28f608 --out "$RUNNER_TEMP/desktop-release"
          else
            npm exec --workspace @rakazo/desktop -- node scripts/package-macos.mjs --arch x64 --out "$RUNNER_TEMP/desktop-release"
          fi
          node apps/desktop/scripts/verify-local-server.mjs --server-root "$RUNNER_TEMP/desktop-release/${{ matrix.app_dir }}/Mycellios Desktop.app/Contents/Resources/local-server" --web-root "$RUNNER_TEMP/desktop-release/${{ matrix.app_dir }}/Mycellios Desktop.app/Contents/Resources/web"
      - name: Qualify packaged launch and the distributed DMG signature
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop-release"
          app="$out/${{ matrix.app_dir }}/Mycellios Desktop.app"
          version="$(node -p 'require("./src/agent/apps/desktop/package.json").version')"
          node scripts/qualify-native-macos.mjs "$app" "$out/evidence"
          node scripts/desktop-macos/qualify-dmg.mjs "$app" "$out/Mycellios-Desktop-$version-macos-${{ matrix.arch }}-preview.dmg" "$out/evidence/dmg-signature.json"
          node scripts/write-platform-release.mjs "$out" macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ inputs.revision || github.sha }}
          path: |
            ${{ runner.temp }}/desktop-release/*.dmg
            ${{ runner.temp }}/desktop-release/platform-release-*.json
            ${{ runner.temp }}/desktop-release/evidence/
          if-no-files-found: error
          retention-days: 14
