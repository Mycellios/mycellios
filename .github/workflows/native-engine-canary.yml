name: Managed CLI canary

on:
  pull_request:
    paths:
      - ".github/workflows/native-engine-canary.yml"
      - "src/agent/packages/adapters/src/native-agent-process.ts"
      - "src/agent/packages/adapters/src/native-engine-store.ts"
      - "src/agent/packages/adapters/src/native-engines.*.json"
      - "src/agent/scripts/native-engine-canary.ts"
  schedule:
    - cron: "32 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-engines:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: win32-x64 }
          - { runner: windows-11-arm, target: win32-arm64 }
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --import tsx scripts/native-engine-canary.ts ${{ matrix.target }}
