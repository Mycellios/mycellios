name: Tailscale gateway qualification

on:
  push:
    branches: [feat/tailscale-connections]
  pull_request:
    paths:
      - src/agent/infra/tailscale/**
      - .github/workflows/tailscale-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailscale-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gateway:
    name: Linux gateway build and native startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: qualification
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the exact gateway candidate
        run: |
          mkdir -p build/tailscale-gateway
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --iidfile build/tailscale-gateway/image-id.txt \
            -f src/agent/infra/tailscale/Dockerfile \
            -t mycellios-tailscale:qualification src/agent
      - name: Exercise real userspace Tailscale without host privileges
        run: |
          export TAILSCALE_GATEWAY_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$TAILSCALE_GATEWAY_KEY"
          echo "TAILSCALE_GATEWAY_KEY=$TAILSCALE_GATEWAY_KEY" >> "$GITHUB_ENV"
          docker volume create tailscale-qualification-state >/dev/null
          docker run -d --name tailscale-qualification --read-only --init \
            --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp \
            --memory 512m --cpus 1 -e TAILSCALE_GATEWAY_KEY \
            -v tailscale-qualification-state:/state -p 127.0.0.1:8095:8095 \
            mycellios-tailscale:qualification
          node src/agent/infra/tailscale/native-smoke.mjs build/tailscale-gateway/native-startup.json
      - name: Create an ephemeral real Tailscale network
        run: node src/agent/infra/tailscale/live-network.mjs
      - name: Install locked Agent qualification dependencies
        working-directory: src/agent
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test actual Mico admission against the private MCP
        working-directory: src/agent
        env:
          DATABASE_URL: postgres://postgres:qualification@127.0.0.1:5432/qualification
        run: |
          npm run db:generate
          npm run migrate --workspace @rakazo/db
          npx tsx scripts/verify-tailscale-live.ts
      - name: Seal the built image
        run: |
          docker save mycellios-tailscale:qualification | gzip > build/tailscale-gateway/image.tar.gz
          sha256sum build/tailscale-gateway/image.tar.gz > build/tailscale-gateway/image.tar.gz.sha256
          printf '%s\n' "$GITHUB_SHA" > build/tailscale-gateway/revision.txt
      - name: Stop only this qualification container
        if: always()
        run: |
          docker rm -f tailscale-qualification tailnet-peer tailnet-control >/dev/null 2>&1 || true
          docker network rm tailnet-qualification >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tailscale-gateway-${{ github.sha }}
          path: build/tailscale-gateway
          if-no-files-found: error
          retention-days: 14
