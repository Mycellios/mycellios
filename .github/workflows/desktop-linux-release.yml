name: Desktop Linux release package
on:
  push:
    branches: ['codex/desktop-linux-release-*']
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-linux-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_REVISION: ${{ inputs.revision || github.sha }}
      RAKAZO_PROJECT_LOCAL: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Retrieve the verified native Linux runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-release"
          previous="$RUNNER_TEMP/previous.deb"
          curl -fsSL --retry 2 https://www.mycellios.com/downloads/desktop/releases/0.3.9/Mycellios-Desktop-0.3.9-linux-x64-pilot.deb -o "$previous"
          echo "ef4fb775c471c851f23fa0da0347ae8247537bf2c8a098722a2b4fe1a2593806  $previous" | sha256sum -c -
          ar p "$previous" data.tar.gz | tar -xzOf - './opt/Mycellios Desktop/resources/contribution/mycellios-runtime.deb' > "$RUNNER_TEMP/runtime.deb"
          echo "fff304aa909775d0098e5837a3cbdb986a87cdfefa0ffcb4cedfb4d67f8d6d09  $RUNNER_TEMP/runtime.deb" | sha256sum -c -
      - name: Install the locked root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the canonical Desktop package
        working-directory: src/agent
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run db:generate
          node --test apps/desktop/scripts/linux-installer.test.mjs apps/desktop/scripts/release-continuity.test.mjs
          npm run build --workspace @rakazo/web -- --desktop
          npm run build --workspace @rakazo/desktop
          npm run build:local-server --workspace @rakazo/desktop
          npm exec --workspace @rakazo/desktop -- node scripts/package-linux.mjs --runtime "$RUNNER_TEMP/runtime.deb" --sha256 fff304aa909775d0098e5837a3cbdb986a87cdfefa0ffcb4cedfb4d67f8d6d09 --out "$RUNNER_TEMP/desktop-release"
          node node_modules/electron/install.js
          node -e 'require("electron")'
          electron_bin="$(node -p 'require("electron")')"
          test -x "$electron_bin"
          sudo chown root:root "$(dirname "$electron_bin")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$electron_bin")/chrome-sandbox"
          xvfb-run -a node apps/desktop/scripts/verify-local-server.mjs --server-root "$RUNNER_TEMP/desktop-release/linux-unpacked/resources/local-server" --web-root "$RUNNER_TEMP/desktop-release/linux-unpacked/resources/web"
      - name: Launch the packaged app with an isolated profile
        working-directory: src/agent
        run: |
          set -euo pipefail
          sudo chown root:root "$RUNNER_TEMP/desktop-release/linux-unpacked/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/desktop-release/linux-unpacked/chrome-sandbox"
          xvfb-run -a node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdtemp } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { _electron, expect } from '@playwright/test';
          const profile = await mkdtemp(join(tmpdir(), 'mycellios-linux-proof-'));
          const app = await _electron.launch({
            executablePath: join(process.env.RUNNER_TEMP, 'desktop-release/linux-unpacked/mycellios-desktop'),
            chromiumSandbox: true,
            env: { ...process.env, RAKAZO_PERFORMANCE_USER_DATA: profile, RAKAZO_DISABLE_AUTO_UPDATE: '1',
              RAKAZO_WEB_URL: 'data:text/html,<main>Mycellios Linux proof</main>' },
          });
          try {
            await expect.poll(() => app.windows().some(page => page.url().startsWith('data:text/html')), { timeout: 60000 }).toBe(true);
            const page = app.windows().find(window => window.url().startsWith('data:text/html'));
            await expect(page.getByText('Mycellios Linux proof')).toBeVisible();
            assert.equal(await page.evaluate(() => window.rakazoDesktop?.platform), 'linux');
            assert.equal(await app.evaluate(({ app }) => app.isPackaged), true);
          } finally {
            await app.close();
          }
          NODE
      - name: Build and install the Fedora RPM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm zstd
          out="$RUNNER_TEMP/desktop-release"
          version="$(node -p 'require("./src/agent/apps/desktop/package.json").version')"
          source="$out/Mycellios-Desktop-$version-source-${RELEASE_REVISION:0:8}.tar.gz"
          git archive --format=tar.gz --prefix=mycellios/ --output="$source" HEAD
          export DESKTOP_RELEASE_OUT="$out" DESKTOP_VERSION="$version" DESKTOP_SOURCE="$source"
          node --input-type=module <<'NODE'
          import { basename, join } from "node:path";
          import { buildDesktopRpm, sha256 } from "./scripts/build-desktop-rpm.mjs";
          const { DESKTOP_RELEASE_OUT: out, DESKTOP_VERSION: version, DESKTOP_SOURCE: source, RELEASE_REVISION: baseline } = process.env;
          const deb = join(out, `Mycellios-Desktop-${version}-linux-x64-pilot.deb`);
          const artifact = async file => ({
            url: `https://www.mycellios.com/downloads/desktop/releases/${version}/${basename(file)}`,
            sha256: await sha256(file),
          });
          await buildDesktopRpm({
            release: { version, runtimeVersion: "0.2.95", baseline, desktop: await artifact(deb), source: await artifact(source) },
            deb, source, outputDirectory: join(out, "fedora"), installer: "deploy/linux/install-desktop-runtime.sh",
          });
          NODE
          rpm="$out/fedora/Mycellios-Desktop-$version-fedora-x86_64.rpm"
          docker run --rm -v "$rpm:/tmp/mycellios.rpm:ro" fedora:44             bash -ec 'dnf install -y /tmp/mycellios.rpm >/tmp/install.log 2>&1 || { cat /tmp/install.log; exit 1; }; rpm -q mycellios-desktop; test -x "/opt/Mycellios Desktop/mycellios-desktop"; test -s "/opt/Mycellios Desktop/resources/app.asar"; test -s /usr/share/applications/mycellios-desktop.desktop'
          (cd "$out"; sha256sum *.deb *.AppImage *.tar.gz fedora/*.rpm > SHA256SUMS.txt)
          printf '%s\n' "$RELEASE_REVISION" > "$out/candidate-sha.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-linux-${{ inputs.revision || github.sha }}
          path: |
            ${{ runner.temp }}/desktop-release/*.deb
            ${{ runner.temp }}/desktop-release/*.AppImage
            ${{ runner.temp }}/desktop-release/*.tar.gz
            ${{ runner.temp }}/desktop-release/candidate-sha.txt
            ${{ runner.temp }}/desktop-release/desktop-build.json
            ${{ runner.temp }}/desktop-release/latest-linux.yml
            ${{ runner.temp }}/desktop-release/SHA256SUMS.txt
            ${{ runner.temp }}/desktop-release/fedora/*.rpm
            ${{ runner.temp }}/desktop-release/fedora/*.json
          if-no-files-found: error
          retention-days: 7
