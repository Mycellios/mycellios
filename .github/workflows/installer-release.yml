name: Publish all Mycellios installers
on:
  workflow_run:
    workflows: [Proportional remote validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
  queue: max
jobs:
  admit:
    if: github.repository == 'Mycellios/mycellios'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/installer-release-admission.mjs
  windows:
    needs: admit
    if: needs.admit.outputs.ready == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-windows-release.yml
    with:
      revision: ${{ needs.admit.outputs.revision }}
      expedited: false
  linux:
    needs: admit
    if: needs.admit.outputs.ready == 'true'
    uses: ./.github/workflows/desktop-linux-release.yml
    with:
      revision: ${{ needs.admit.outputs.revision }}
  macos:
    needs: admit
    if: needs.admit.outputs.ready == 'true'
    uses: ./.github/workflows/desktop-macos.yml
    with:
      revision: ${{ needs.admit.outputs.revision }}
  android:
    needs: admit
    if: needs.admit.outputs.ready == 'true'
    uses: ./.github/workflows/android-release.yml
    with:
      revision: ${{ needs.admit.outputs.revision }}
  # The release revision's self-host images. A version merge made with the workflow token starts
  # no push run, so nothing else builds them; images that a push run already wrote are kept.
  self-host-images:
    needs: admit
    if: needs.admit.outputs.ready == 'true'
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/self-host-images.yml
    with:
      revision: ${{ needs.admit.outputs.revision }}
  publish:
    needs: [admit, windows, linux, macos, android]
    concurrency:
      group: installer-publication
      cancel-in-progress: false
      queue: max
    if: needs.admit.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admit.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: desktop-*-${{ needs.admit.outputs.revision }}
          path: release-inputs
      - name: Publish only the exact qualified platform set
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/publish-installer-release.mjs release-inputs; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
  verify-promotion:
    needs: [admit, publish]
    if: needs.admit.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admit.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Verify public catalogs, original Android signer and actual downloads
        run: node scripts/verify-installer-promotion.mjs
  self-host-release:
    # Once the Desktop release is public: v<version> names the same app, computer and updater
    # manifests as sha-<revision> (nothing is rebuilt), then the commit gets the v<version> tag
    # of that self-host release. Neither tag ever moves (scripts/self-host-images.mjs).
    needs: [admit, publish, self-host-images]
    if: ${{ !cancelled() && needs.admit.outputs.ready == 'true' && needs.publish.result == 'success' && needs.self-host-images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admit.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the release's self-host images and commit v<version>
        env:
          REVISION: ${{ needs.admit.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/self-host-images.mjs release
  node-components:
    # Signed node runtime components (specs/node-runtime-auto-update): one stable
    # manifest carrying python-product and node-app, both built from the admitted
    # revision. Opt-in with the MYCELLIOS_NODE_COMPONENT_PUBLICATION=enabled
    # variable; once enabled, a missing stable key, trust anchor or publication
    # token fails this job closed. Installers never depend on it, and nothing
    # here builds, signs or installs an EXE/MSI/DMG/PKG/DEB.
    needs: [admit, publish]
    if: needs.admit.outputs.ready == 'true' && vars.MYCELLIOS_NODE_COMPONENT_PUBLICATION == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: node-component-release
    concurrency:
      group: node-component-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    env:
      REVISION: ${{ needs.admit.outputs.revision }}
    steps:
      - name: Require the stable signing key, trust anchor and publication token
        env:
          MYCELLIOS_COMPONENT_STABLE_SIGNING_KEY: ${{ secrets.MYCELLIOS_COMPONENT_STABLE_SIGNING_KEY }}
          MYCELLIOS_NODE_COMPONENT_TRUST: ${{ vars.MYCELLIOS_NODE_COMPONENT_TRUST }}
          MYCELLIOS_MODEL_ADMIN_TOKEN: ${{ secrets.MYCELLIOS_COMPONENT_PUBLISH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for name in MYCELLIOS_COMPONENT_STABLE_SIGNING_KEY MYCELLIOS_NODE_COMPONENT_TRUST MYCELLIOS_MODEL_ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured; refusing to publish node components."
              exit 1
            fi
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admit.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Confirm the admitted revision
        run: test "$(git rev-parse HEAD)" = "$REVISION"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile production node payload
        run: npm run clean --silent && npx tsc -p tsconfig.build.json
      - name: Stage the node-app component from the installer layout
        run: |
          node scripts/prepare-packaged-python-source.mjs
          node scripts/stage-node-installer.mjs --component=node-app \
            --dist=dist \
            --node-modules=node_modules \
            --python-source=build/python \
            --source-root=. \
            --source-revision="$REVISION" \
            --output=build/node-package/node-app-windows-x64
      - name: Sign and publish python-product and node-app in one manifest
        env:
          MYCELLIOS_COMPONENT_STABLE_SIGNING_KEY: ${{ secrets.MYCELLIOS_COMPONENT_STABLE_SIGNING_KEY }}
          MYCELLIOS_NODE_COMPONENT_TRUST: ${{ vars.MYCELLIOS_NODE_COMPONENT_TRUST }}
          MYCELLIOS_MODEL_ADMIN_TOKEN: ${{ secrets.MYCELLIOS_COMPONENT_PUBLISH_ADMIN_TOKEN }}
          MYCELLIOS_COMPONENT_UPDATE_PUBLISH_URL: ${{ vars.MYCELLIOS_COMPONENT_UPDATE_PUBLISH_URL }}
        run: |
          npx tsx scripts/component-update-cli.ts release \
            --platform=win32 \
            --arch=x64 \
            --revision="$REVISION" \
            --node-app-root=build/node-package/node-app-windows-x64 \
            --output=".codex-runtime/component-updates/releases/stable/$REVISION"
      - name: Keep the signed public release record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-components-${{ needs.admit.outputs.revision }}
          path: .codex-runtime/component-updates/releases/stable/${{ needs.admit.outputs.revision }}
          if-no-files-found: ignore
          retention-days: 90
