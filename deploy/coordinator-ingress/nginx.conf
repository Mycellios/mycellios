worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    server {
        listen 4174;

        location = /_mycellios_coordinator_gate {
            internal;
            proxy_pass http://unix:/etc/mycellios-route/gate.sock:/route;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 12s;
        }

        location / {
            auth_request /_mycellios_coordinator_gate;
            auth_request_set $coordinator_backend $upstream_http_x_mycellios_backend;
            proxy_pass http://$coordinator_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_next_upstream off;
        }
    }

    server {
        listen 127.0.0.1:4175;
        include /etc/mycellios-route/active.conf;
        location = /health {
            proxy_pass http://$coordinator_backend;
        }
        location / { return 404; }
    }
}
