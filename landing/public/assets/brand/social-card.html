<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Mycellios social card source · 1200 × 630</title>
  <style>
    @font-face { font-family: "Geist Variable"; src: url("../fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #faf9f7; }
    body { font-family: "Geist Variable", sans-serif; color: #16221b; }
    main { position: relative; width: 1200px; height: 630px; overflow: hidden; }
    header { position: absolute; inset: 42px 52px auto; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 29px; font-weight: 500; letter-spacing: -.8px; }
    .brand img { width: 34px; height: 34px; }
    .domain { font-size: 20px; color: #59635d; }
    h1 { position: absolute; z-index: 1; top: 115px; left: 60px; right: 60px; margin: 0; font-size: 66px; line-height: 1.04; letter-spacing: -2.5px; text-align: center; font-weight: 500; }
    h1 span { color: #263c2b; }
    .network { position: absolute; left: 235px; top: 280px; width: 730px; height: 360px; object-fit: contain; object-position: top center; }
  </style>
</head>
<body>
  <main aria-label="Mycellios — many machines, one shared network">
    <header><div class="brand"><img src="favicon.png" alt="">Mycellios</div><span class="domain">mycellios.com</span></header>
    <h1>Many machines.<br><span>One shared network.</span></h1>
    <img class="network" src="../landing/network-fruiting.webp" alt="Conceptual illustration of computers connected by mycelium">
  </main>
</body>
</html>
