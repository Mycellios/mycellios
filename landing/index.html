      @keyframes mycellios-cap-grow { 0% { stroke-dashoffset:72; opacity:.2; } 44%,78% { stroke-dashoffset:0; opacity:1; } 100% { stroke-dashoffset:-72; opacity:.12; } }

      @media (prefers-reduced-motion:reduce) { #mycellios-loader { transition-duration:80ms; } .mycellios-loader__cap,.mycellios-loader__stem,.mycellios-loader__gills,.mycellios-loader__spore { animation:none; } }

    <div id="mycellios-loader" role="status" aria-live="polite" aria-label="Loading mycellios">
      <svg class="mycellios-loader__mark" viewBox="0 0 68 68" aria-hidden="true">
        <g><circle class="mycellios-loader__spore" cx="18" cy="22" r="1.15" /><circle class="mycellios-loader__spore" cx="49" cy="18" r=".9" /><circle class="mycellios-loader__spore" cx="54" cy="31" r=".7" /></g>
        <path class="mycellios-loader__cap" pathLength="72" d="M17 35.5C18.8 25.4 25 20 34 20s15.2 5.4 17 15.5c-8.7-2.6-25.3-2.6-34 0Z" />
        <path class="mycellios-loader__stem" pathLength="30" d="M29.8 35.2c.3 5.8-.8 10.8-3.7 15.5 4.9 2.4 10.9 2.4 15.8 0-2.9-4.7-4-9.7-3.7-15.5" />
        <path class="mycellios-loader__gills" d="m21.5 34.4 8.9 5.2M46.5 34.4l-8.9 5.2M27 33.5l4.7 6.8m9.3-6.8-4.7 6.8M34 33.2v8" />
      </svg>
    </div>
    <div id="root"></div>
    <script id="forest-loader-bootstrap">
      (() => {
        const loader = document.getElementById("mycellios-loader");
        const root = document.getElementById("root");
        const url = new URL(location.href);
        const legacy = ["previous", "saved", "rooted", "assemblage"].includes(url.searchParams.get("landing"));
        const publicPaperPage = /^\/(?:$|rebrand\/?$|earn\/?$|pricing\/?$|compare(?:\/|$)|changelog\/?$|spore(?:\/|$)|downloads(?:\/|$)|blog(?:\/|$)|stats\/?$)/.test(url.pathname)
          || (url.pathname === "/dashboard" && !url.search);
        if (publicPaperPage && !legacy && url.searchParams.get("intro") !== "forest") loader.dataset.theme = "paper";
        let seen = false;
        try { seen = sessionStorage.getItem("mycellios.forestIntro.v1") === "seen"; } catch { /* Private browsing can deny storage. */ }
        if (url.searchParams.get("intro") !== "forest" || url.pathname !== "/" || url.hash || legacy || url.searchParams.get("art") === "fabric"
          || matchMedia("(prefers-reduced-motion: reduce)").matches
          || (seen && url.searchParams.get("intro") !== "forest")) return;
        loader.dataset.mode = "forest";
        document.documentElement.dataset.forestLoading = "";
        root.inert = true;
        root.setAttribute("aria-hidden", "true");
        const picture = document.createElement("picture");
        const source = document.createElement("source");
        source.media = "(orientation: portrait)";
        source.srcset = "/assets/loading/forest-portrait-clean-v1.webp";
        const image = document.createElement("img");
        image.alt = "";
        image.fetchPriority = "high";
        picture.append(source, image);
        const actions = document.createElement("div");
        actions.id = "forest-loader-actions";
        loader.append(picture, actions);
        image.src = "/assets/loading/forest-clean-v1.webp";
        let disabled = false;
        let claimTimer;
        let released = false;
        const release = () => {
          if (released) return;
          released = true;
          clearTimeout(watchdog);
          clearTimeout(claimTimer);
          const restoreFocus = loader.contains(document.activeElement);
          loader.dispatchEvent(new Event("mycellios:loader-released", { bubbles: true }));
          root.inert = false;
          root.removeAttribute("aria-hidden");
          delete document.documentElement.dataset.forestLoading;
          loader.remove();
          if (restoreFocus) root.querySelector(".assembly-skip")?.focus({ preventScroll: true });
        };
        const disable = () => {
          disabled = true;
          if (loader.dataset.routeReady) release();
        };
        loader.addEventListener("mycellios:forest-disable", disable);
        loader.addEventListener("mycellios:forest-finish", release);
        loader.addEventListener("mycellios:route-ready", () => {
          loader.dataset.routeReady = "true";
          if (disabled) release();
          else claimTimer = setTimeout(() => { if (!loader.dataset.claimed) disable(); }, 700);
        });
        // Even a failed animation chunk must reveal the page once its route mounts.
        const watchdog = setTimeout(disable, 7000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
