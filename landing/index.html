      .seo-static-fallback h1 { max-width:18ch; margin:0 0 1.5rem; font-size:clamp(2.25rem,7vw,4.5rem); line-height:1.08; }
      .seo-static-fallback p { max-width:68ch; font-size:1.1rem; }
      .seo-static-fallback a { color:#142019; text-underline-offset:.2em; }

      #mycellios-loader { position:fixed; z-index:1000; inset:0; display:grid; place-items:center; color:#203b2b; background:#fff; transition:opacity 240ms cubic-bezier(.165,.84,.44,1),visibility 240ms linear; }
      #mycellios-loader[data-state="leaving"] { opacity:0; visibility:hidden; }
      #mycellios-loader[data-theme="paper"] { background:#faf9f7; color:#203b2b; }
      html[data-forest-loading] { overflow:hidden; scrollbar-gutter:stable; }
      #mycellios-loader[data-mode="forest"] { display:block; background:#17221a; transition:none; }
      #mycellios-loader[data-mode="forest"] > .mycellios-loader__mark { display:none; }
      #mycellios-loader[data-mode="forest"] picture, #mycellios-loader[data-mode="forest"] img, #mycellios-loader[data-mode="forest"] canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
      #mycellios-loader[data-animated] { background:transparent; }
      #mycellios-loader[data-animated] picture { visibility:hidden; }
      #forest-loader-actions { position:absolute; z-index:1; right:calc(1.25rem + env(safe-area-inset-right)); bottom:calc(1.25rem + env(safe-area-inset-bottom)); padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); }
      .mycellios-loader__mark { display:inline-grid; justify-items:center; gap:14px; font:500 26px/1.5 "Geist Variable",ui-sans-serif,system-ui,sans-serif; letter-spacing:-.025em; }
      .mycellios-loader__mark img { display:block; width:76px; height:76px; }
      @media (prefers-reduced-motion:reduce) { #mycellios-loader { transition-duration:80ms; } }

  <body>
    <div id="mycellios-loader" role="status" aria-live="polite" aria-label="Loading mycellios">
      <span class="mycellios-loader__mark"><img src="/brand/agent-loader.svg" width="76" height="76" alt="" aria-hidden="true" /><span>Mycellios</span></span>
    </div>
    <div id="root"></div>
    <script id="forest-loader-bootstrap">
      (() => {
        const loader = document.getElementById("mycellios-loader");
        const root = document.getElementById("root");
        const url = new URL(location.href);
        const legacy = ["previous", "saved", "rooted", "assemblage"].includes(url.searchParams.get("landing"));
        const publicPaperPage = /^\/(?:$|rebrand\/?$|earn\/?$|pricing\/?$|compare(?:\/|$)|changelog\/?$|spore(?:\/|$)|downloads(?:\/|$)|blog(?:\/|$)|stats\/?$)/.test(url.pathname)
          || (url.pathname === "/dashboard" && !url.search);
        if (publicPaperPage && !legacy && url.searchParams.get("intro") !== "forest") loader.dataset.theme = "paper";
        let seen = false;
        try { seen = sessionStorage.getItem("mycellios.forestIntro.v1") === "seen"; } catch { /* Private browsing can deny storage. */ }
        if (url.searchParams.get("intro") !== "forest" || url.pathname !== "/" || url.hash || legacy || url.searchParams.get("art") === "fabric"
          || matchMedia("(prefers-reduced-motion: reduce)").matches
          || (seen && url.searchParams.get("intro") !== "forest")) return;
        loader.dataset.mode = "forest";
        document.documentElement.dataset.forestLoading = "";
        root.inert = true;
        root.setAttribute("aria-hidden", "true");
        const picture = document.createElement("picture");
        const source = document.createElement("source");
        source.media = "(orientation: portrait)";
        source.srcset = "/assets/loading/forest-portrait-clean-v1.webp";
        const image = document.createElement("img");
        image.alt = "";
        image.fetchPriority = "high";
        picture.append(source, image);
        const actions = document.createElement("div");
        actions.id = "forest-loader-actions";
        loader.append(picture, actions);
        image.src = "/assets/loading/forest-clean-v1.webp";
        let disabled = false;
        let claimTimer;
        let released = false;
        const release = () => {
          if (released) return;
          released = true;
          clearTimeout(watchdog);
          clearTimeout(claimTimer);
          const restoreFocus = loader.contains(document.activeElement);
          loader.dispatchEvent(new Event("mycellios:loader-released", { bubbles: true }));
          root.inert = false;
          root.removeAttribute("aria-hidden");
          delete document.documentElement.dataset.forestLoading;
          loader.remove();
          if (restoreFocus) root.querySelector(".assembly-skip")?.focus({ preventScroll: true });
        };
        const disable = () => {
          disabled = true;
          if (loader.dataset.routeReady) release();
        };
        loader.addEventListener("mycellios:forest-disable", disable);
        loader.addEventListener("mycellios:forest-finish", release);
        loader.addEventListener("mycellios:route-ready", () => {
          loader.dataset.routeReady = "true";
          if (disabled) release();
          else claimTimer = setTimeout(() => { if (!loader.dataset.claimed) disable(); }, 700);
        });
        // Even a failed animation chunk must reveal the page once its route mounts.
        const watchdog = setTimeout(disable, 7000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
