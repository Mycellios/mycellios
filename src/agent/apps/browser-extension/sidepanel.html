<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mycellios Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <header>
    <details class="appearance">
      <summary data-i18n="appearance">Appearance</summary>
      <div class="appearance-controls">
        <label class="appearance-row">
          <span data-i18n="design">Design</span>
          <select id="design">
            <option value="original" data-i18n="themeOriginal">Mycellios</option>
            <option value="light" data-i18n="themeLight">White</option>
            <option value="dark" data-i18n="themeDark">Dark</option>
            <option value="system" data-i18n="themeSystem">System</option>
          </select>
        </label>
        <label class="appearance-row">
          <span data-i18n="discreet">Discreet mode</span>
          <input id="discreet" type="checkbox" />
        </label>
        <div class="appearance-row" id="mic-row" hidden>
          <span data-i18n="micLabel">Dictation microphone</span>
          <button id="mic-open" type="button" class="secondary" data-i18n="micAllow">Allow</button>
        </div>
      </div>
    </details>
    <section id="tabs-share" class="tabs-share" hidden>
      <div class="tabs-share-row">
        <span id="tabs-share-status" class="tabs-share-status" role="status"></span>
        <button id="tabs-share-toggle" type="button" class="secondary"></button>
      </div>
      <p id="tabs-share-detail" class="tabs-share-detail" data-i18n="shareTabsDetail"></p>
      <div id="tabs-act" class="tabs-act" hidden>
        <div class="tabs-share-row">
          <span id="tabs-act-status" class="tabs-share-status" role="status"></span>
          <button id="tabs-act-toggle" type="button" class="secondary"></button>
        </div>
        <p id="tabs-act-detail" class="tabs-share-detail" data-i18n="actDetail"></p>
      </div>
      <div id="tabs-confirm" class="tabs-consent" role="alertdialog" aria-labelledby="tabs-confirm-text" hidden>
        <p id="tabs-confirm-text" class="tabs-consent-text"></p>
        <p id="tabs-confirm-label" class="tabs-consent-detail" hidden></p>
        <div class="tabs-consent-actions">
          <button id="tabs-confirm-allow" type="button"></button>
          <button id="tabs-confirm-deny" type="button" class="secondary"></button>
        </div>
      </div>
      <div id="tabs-consent" class="tabs-consent" role="alertdialog" aria-labelledby="tabs-consent-text" hidden>
        <p id="tabs-consent-text" class="tabs-consent-text"></p>
        <div class="tabs-consent-actions">
          <button id="tabs-consent-once" type="button" data-i18n="consentOnce"></button>
          <button id="tabs-consent-always" type="button" class="secondary" data-i18n="consentAlways"></button>
          <button id="tabs-consent-deny" type="button" class="secondary" data-i18n="consentDeny"></button>
        </div>
      </div>
    </section>
    </header>
    <main id="notice" hidden>
      <img src="icons/icon-128.png" alt="" width="56" height="56" />
      <h1 id="notice-title">Mycellios Agent</h1>
      <div class="actions">
        <button id="primary" type="button"></button>
        <button id="secondary" type="button" class="secondary"></button>
      </div>
    </main>
    <iframe
      id="app"
      title="Mycellios Agent"
      allow="clipboard-read; clipboard-write; microphone; autoplay"
      hidden
    ></iframe>
  </body>
</html>
