appId: com.mycellios.agent
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Mycellios"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Mycellios"
    timeout: 15000
- tapOn: "Email"
- inputText: ${MYCELLIOS_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${MYCELLIOS_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
- extendedWaitUntil:
    visible: "Account"
    timeout: 40000
