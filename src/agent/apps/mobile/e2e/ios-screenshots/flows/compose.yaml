appId: com.mycellios.agent
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MYCELLIOS_ACTIVE_EMAIL: ${MYCELLIOS_SCREENSHOT_EMAIL}
- openLink: "mycellios:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "mycellios:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- takeScreenshot: 04-new-group-name
- openLink: "mycellios:///"
