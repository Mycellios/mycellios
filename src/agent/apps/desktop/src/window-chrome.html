<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mycellios window controls</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="window-chrome.css">
</head>
<body>
  <header aria-label="Window controls">
    <button type="button" data-action="close" aria-label="Close" title="Close"><span class="close"></span></button>
    <button type="button" data-action="minimize" aria-label="Minimize" title="Minimize"><span class="minimize"></span></button>
    <button type="button" data-action="maximize" aria-label="Maximize or restore" title="Maximize or restore"><span class="maximize"></span></button>
  </header>
</body>
</html>
