<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>Mycellios</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">Mycellios</span>
      <button id="quit" class="titlebar-quit" type="button" title="Quit Mycellios">Quit</button>
    </header>

    <main class="shell">
      <h1 id="heading" class="heading">Mycellios</h1>
      <p id="subheading" class="subheading">Connection settings</p>

      <section id="recovery" hidden aria-labelledby="heading">
        <p id="recovery-message" class="subheading" role="alert">We couldn't connect to Mycellios.</p>
        <div class="actions recovery-actions">
          <button id="retry" class="button button-primary" type="button">Retry</button>
          <button id="close" class="button button-secondary" type="button">Close</button>
        </div>
      </section>

      <details id="advanced">
        <summary>Advanced</summary>
        <p id="recovery-diagnostic" class="recovery-diagnostic" hidden></p>
      <form id="setup" novalidate>
          <fieldset class="choices">
            <legend class="sr-only">Instance</legend>
            <label class="choice" for="mode-new">
              <input id="mode-new" type="radio" name="mode" value="new" />
              <span class="choice-title">Run a self-hosted server on this computer</span>
            </label>
            <label class="choice" for="mode-existing">
              <input id="mode-existing" type="radio" name="mode" value="existing" checked />
              <span class="choice-title">Connect to a server</span>
            </label>
          </fieldset>

        <section id="panel-new" class="panel">
          <div id="stack" hidden>
            <div class="stack-head">
              <p id="stack-phase" class="stack-phase" role="status" aria-live="polite"></p>
              <button
                id="stack-details"
                class="icon-button"
                type="button"
                aria-controls="stack-output"
                aria-expanded="false"
                aria-label="Technical details"
                title="Technical details"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3.5 4.5 7 8l-3.5 3.5M8.5 11.5H13" />
                </svg>
              </button>
            </div>
            <div
              id="stack-progress"
              class="progress"
              role="progressbar"
              aria-label="Setup progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              hidden
            >
              <div id="stack-progress-fill" class="progress-fill"></div>
            </div>
            <p id="stack-detail" class="stack-detail"></p>
            <pre id="stack-output" class="stack-output" hidden></pre>
            <div id="stack-docker-help" class="stack-help" hidden>
              <button class="link" type="button" data-link="docker-desktop">Docker Desktop</button>
              <button class="link" type="button" data-link="orbstack">OrbStack</button>
              <button class="link" type="button" data-link="docker-engine">Docker Engine</button>
            </div>
          </div>
        </section>

        <section id="panel-existing" class="panel" hidden>
          <label class="field-label" for="server-url">Server address</label>
          <input
            id="server-url"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://www.mycellios.com/agent"
          />
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="check" class="button button-secondary" type="button">Check connection</button>
          <button id="continue" class="button button-primary" type="submit">Continue</button>
        </div>
      </form>
      </details>
    </main>

    <script src="setup.js"></script>
  </body>
</html>
