<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 96 96" fill="none">
  <style>
    .ring { transform-origin: 48px 48px; animation: orbit 5s linear infinite; }
    .mascot { transform-origin: 48px 68px; animation: sway 1.8s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes sway { 0%,100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-2px); } }
    @keyframes blink { 0%,43%,49%,100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) { .ring,.mascot,.eyes { animation: none; } }
  </style>
  <circle cx="48" cy="48" r="38" fill="#3f9f78" fill-opacity=".06"/>
  <g class="ring">
    <circle cx="48" cy="48" r="36" stroke="#3f9f78" stroke-opacity=".32" stroke-width="1.2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="48" cy="12" r="2.5" fill="#3f9f78"/>
  </g>
  <g class="mascot">
    <g transform="translate(22 20) scale(.8125)">
      <path fill="#3f9f78" d="M26 30h12l3 21c.5 3.5-2 6-5.5 6h-7c-3.5 0-6-2.5-5.5-6l3-21Z"/>
      <path fill="#3f9f78" d="M6 28C7 16 18 7 32 7s25 9 26 21c.3 4-2.5 7-6.5 7h-39C8.5 35 5.7 32 6 28Z"/>
      <g class="eyes" fill="#1d2b23">
        <rect x="26" y="40" width="3.5" height="8" rx="1.75"/>
        <rect x="34.5" y="40" width="3.5" height="8" rx="1.75"/>
      </g>
    </g>
  </g>
</svg>
